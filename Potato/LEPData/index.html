<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potatoverse Terminal - Lore</title>
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #18191c;
      --embed-bg: #2b2d31;
      --text-color: #dbdee1;
      --accent-yellow: #fee75c;
      --accent-green: #57f287;
      --accent-red: #ed4245;
      --terminal-bg: #0b0c10;
      --terminal-text: #00ff66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'gg sans', 'Consolas', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    /* --- STYLES TERMINAL ANIMÉ --- */
    .terminal-card {
      background: var(--terminal-bg);
      border: 1px solid #1f232a;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
      position: relative;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--accent-yellow);
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .terminal-body {
      color: var(--terminal-text);
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 220px;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: var(--terminal-text);
      animation: blink 0.8s infinite;
      vertical-align: middle;
      margin-left: 4px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .terminal-footer {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #666;
      border-top: 1px solid #222;
      padding-top: 10px;
    }

    .skip-btn {
      background: transparent;
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .skip-btn:hover {
      background: var(--accent-yellow);
      color: #000;
    }

    /* --- STYLES EMBED DISCORD --- */
    .discord-embed {
      background-color: var(--embed-bg);
      border-left: 4px solid var(--accent-yellow);
      border-radius: 6px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none;
    }

    .embed-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .character-select {
      width: 100%;
      padding: 12px;
      background-color: #1e1f22;
      color: #ffffff;
      border: 1px solid #3f4147;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 20px;
      cursor: pointer;
      outline: none;
    }

    .character-select:focus {
      border-color: #5865f2;
    }

    .embed-content {
      line-height: 1.6;
      font-size: 0.95rem;
      min-height: 120px;
    }

    .embed-content h2 {
      font-size: 1.15rem;
      color: #ffffff;
      margin-top: 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid #3f4147;
      padding-bottom: 4px;
    }

    .embed-content ul {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .embed-content li {
      margin-bottom: 4px;
    }

    .embed-image {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 15px;
    }

    .embed-footer {
      margin-top: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b5bac1;
    }

    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-active { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
    .status-inactive { background-color: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <!-- TERMINAL ANIMÉ -->
    <div id="terminal" class="terminal-card">
      <div class="terminal-header">
        <span>🥔 Potatoverse Terminal</span>
        <button id="skipBtn" class="skip-btn" onclick="skipAnimation()">Passer ⏭</button>
      </div>
      <div class="terminal-body" id="terminalConsole"></div>
      <div class="terminal-footer" id="terminalFooter">Potatoverse Network</div>
    </div>

    <!-- INTERFACE / EMBED DISCORD -->
    <div id="app" class="discord-embed">
      <div class="embed-title" id="embedTitle">
        Liste des personnages du Lore Étendu du Potatoverse !
      </div>

      <!-- SÉLECTEUR DE PERSONNAGES -->
      <select id="characterSelect" class="character-select" onchange="onCharacterSelect(this.value)">
        <option value="" disabled selected>Chargement des données...</option>
      </select>

      <!-- CONTENU DU LORE (ANIMATION LETTRE PAR LETTRE) -->
      <div id="embedBody" class="embed-content">
        Utilisez le menu déroulant ci-dessus pour choisir un personnage et voir son histoire.
      </div>

      <!-- IMAGE DU PERSONNAGE -->
      <img id="embedImage" class="embed-image hidden" src="" alt="Image du personnage">

      <!-- FOOTER / STATUT -->
      <div class="embed-footer" id="embedFooter">
        <span id="statusDot" class="status-badge hidden"></span>
        <span id="footerText">Potatoverse Network</span>
      </div>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------
    // CONFIGURATION : REMPLACE CETTE URL PAR TON LIEN VERCEL
    // ------------------------------------------------------------
    const VERCEL_API_URL = "https://potatoverse-api.vercel.app/api/characters";

    // Effet sonore synthétisé (pas de fichier audio externe requis)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.02) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.03;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // ------------------------------------------------------------
    // ANIMATION DU TERMINAL INITIAL
    // ------------------------------------------------------------
    const terminalSteps = [
      { text: "Connexion au LEP...", delay: 500 },
      { text: "Connexion au réseau du Potatoverse...", delay: 450 },
      { text: "Protection contre les incursions du Multivers...", delay: 500 },
      { text: "Authentification de PotatoBot...", delay: 450 },
      { text: "Accès à la base de données OraxDB...", delay: 600 },
      { text: "Interrogation de l'API Vercel...", delay: 700 },
      { text: "Déchiffrement des archives du LEP...", delay: 500 },
      { text: "Vérification de l'intégrité des données...", delay: 400 },
      { text: "Accès autorisé.", delay: 350 },
      { text: "Chargement du Lore Étendu du Potatoverse...", delay: 600 }
    ];

    let isSkipped = false;
    let timeoutId = null;
    let displayedLines = [];
    let charactersData = [];

    const consoleEl = document.getElementById("terminalConsole");
    const footerEl = document.getElementById("terminalFooter");

    function renderTerminalLines(isFinal = false) {
      let text = displayedLines.map(line => `> ${line}`).join("\n");
      if (!isFinal) text += "\n\n▌";
      consoleEl.textContent = text;
    }

    async function runTerminal() {
      displayedLines.push("Initialisation du terminal...");
      renderTerminalLines();

      for (let i = 0; i < terminalSteps.length; i++) {
        if (isSkipped) break;
        await new Promise(resolve => {
          timeoutId = setTimeout(resolve, terminalSteps[i].delay);
        });
        if (!isSkipped) {
          displayedLines.push(terminalSteps[i].text);
          renderTerminalLines();
          playBeep(800, 0.015);
        }
      }
      finishTerminal();
    }

    function skipAnimation() {
      isSkipped = true;
      if (timeoutId) clearTimeout(timeoutId);
      displayedLines = ["Initialisation du terminal...", ...terminalSteps.map(s => s.text)];
      finishTerminal();
    }

    function finishTerminal() {
      renderTerminalLines(true);
      footerEl.textContent = "Connexion au LEP établie.";
      document.getElementById("skipBtn").classList.add("hidden");

      setTimeout(() => {
        document.getElementById("terminal").style.display = "none";
        initApp();
      }, 600);
    }

    // ------------------------------------------------------------
    // CHARGEMENT DE L'API VERCEL / MONGODB
    // ------------------------------------------------------------
    async function loadCharactersFromAPI() {
      try {
        const response = await fetch(VERCEL_API_URL);
        if (!response.ok) throw new Error("Erreur HTTP");
        const data = await response.json();
        
        // Adaptation du schéma MongoDB (Name -> name, Emoji -> emoji, etc.)
        return data.map(item => ({
          id: item._id || item.id,
          name: item.Name || item.name || "Inconnu",
          emoji: item.Emoji || item.emoji || "🥔",
          active: item.Active !== undefined ? item.Active : true,
          image: item.Image || item.image || "",
          description: item.Description || item.description || "Aucune description."
        }));
      } catch (err) {
        console.warn("API indisponible, chargement des données de secours...", err);
        // Données de secours si l'API Vercel n'est pas encore déployée
        return [
          {
            id: "me",
            name: "PotatoBot",
            emoji: "🥔",
            active: true,
            image: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=600&auto=format&fit=crop&q=60",
            description: `## **Histoire**\n\nPotatoBot est une entité polyvalente et déterminée, pilier de l’Académie des Patates. Après avoir voyagé dans le futur pour aider son soi futur, il a ensuite exploré le passé pour corriger les anomalies qu'il avait lui-même provoquées.\n\n## **Passions**\n\n- **Cuisine** : Il adore expérimenter des recettes.\n- **Innovation** : Voyager dans le temps.`
          }
        ];
      }
    }

    async function initApp() {
      const appEl = document.getElementById("app");
      const selectEl = document.getElementById("characterSelect");

      charactersData = await loadCharactersFromAPI();

      selectEl.innerHTML = '<option value="" disabled selected>Choisissez un personnage...</option>';
      charactersData.forEach(char => {
        const option = document.createElement("option");
        option.value = char.id;
        option.textContent = `${char.emoji} ${char.name}`;
        selectEl.appendChild(option);
      });

      appEl.style.display = "block";
    }

    // ------------------------------------------------------------
    // ANIMATION DE TEXTE LETTRE PAR LETTRE (TYPEWRITER)
    // ------------------------------------------------------------
    let typingInterval = null;

    function typeWriterEffect(htmlContent, targetElement, speed = 12) {
      if (typingInterval) clearInterval(typingInterval);
      
      targetElement.innerHTML = "";
      let index = 0;
      let tempContainer = document.createElement("div");
      tempContainer.innerHTML = htmlContent;
      let fullText = tempContainer.innerHTML;

      // Découpage en évitant de couper les balises HTML <...>
      let tokens = [];
      let i = 0;
      while (i < fullText.length) {
        if (fullText[i] === '<') {
          let tagEnd = fullText.indexOf('>', i);
          if (tagEnd !== -1) {
            tokens.push(fullText.substring(i, tagEnd + 1));
            i = tagEnd + 1;
            continue;
          }
        }
        tokens.push(fullText[i]);
        i++;
      }

      typingInterval = setInterval(() => {
        if (index < tokens.length) {
          targetElement.innerHTML += tokens[index];
          if (tokens[index].length === 1 && tokens[index] !== ' ') {
            playBeep(1200 + Math.random() * 200, 0.008);
          }
          index++;
        } else {
          clearInterval(typingInterval);
          typingInterval = null;
        }
      }, speed);
    }

    // ------------------------------------------------------------
    // SÉLECTION DU PERSONNAGE
    // ------------------------------------------------------------
    function onCharacterSelect(characterId) {
      const char = charactersData.find(c => c.id === characterId);
      if (!char) return;

      document.getElementById("embedTitle").innerHTML = `${char.emoji} ${char.name}`;

      const parsedHTML = parseMarkdown(char.description);
      const bodyEl = document.getElementById("embedBody");
      
      // Lancement de l'animation lettre par lettre
      typeWriterEffect(parsedHTML, bodyEl, 8);

      // Gestion de l'image
      const imgEl = document.getElementById("embedImage");
      if (char.image) {
        imgEl.src = char.image;
        imgEl.classList.remove("hidden");
      } else {
        imgEl.classList.add("hidden");
      }

      // Statut et Footer
      const statusDot = document.getElementById("statusDot");
      const footerText = document.getElementById("footerText");

      statusDot.classList.remove("hidden", "status-active", "status-inactive");
      if (char.active) {
        statusDot.classList.add("status-active");
        footerText.textContent = "Actif dans le Potatoverse";
      } else {
        statusDot.classList.add("status-inactive");
        footerText.textContent = "Inactif";
      }
    }

    // ------------------------------------------------------------
    // PARSER MARKDOWN SIMPLE
    // ------------------------------------------------------------
    function parseMarkdown(text) {
      if (!text) return "Aucune description disponible.";

      return text
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    window.onload = runTerminal;
  </script>
</body>
</html>
